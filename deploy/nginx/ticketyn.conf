# HTTP template only. Do not expose without network/access controls: no app auth.
# Add TLS/server_name for a real deployment; HTTPS may also terminate upstream.
# install.sh adjusts only the HTTP listen port and preserves preexisting sites.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/ticketyn/current/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Hashed build assets: missing files must never fall back to SPA HTML.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location ~ /\. {
        deny all;
    }

    # No URI/trailing slash in proxy_pass: preserve /api and query strings.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 180s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    # Backend docs are not proxied by this template. If enabled later,
    # /docs, /redoc and /openapi.json can be blocked here; this is not auth.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
